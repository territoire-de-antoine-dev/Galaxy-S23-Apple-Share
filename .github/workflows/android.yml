name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: Compile OpenDrop S23
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Publish debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenDrop-S23-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
